require conf/distro/poky.conf

DISTRO = "robot"
DISTRO_NAME = "distro for robot"
DISTRO_VERSION = "1.0"
DISTRO_FEATURES:remove = "wayland"
DISTRO_FEATURES:remove = "gobject-introspection-data"
DISTRO_FEATURES:append = " cpufrequtils"
DISTRO_FEATURES:append = " systemd"

INIT_MANAGER = "systemd"

VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
VIRTUAL-RUNTIME_initscripts = ""

hostname:pn-base-files = "robot"

# ==========================================
# Configuration Mender pour OTA Updates
# ==========================================

# Mender nécessite systemd (défini explicitement pour éviter les conflits)

# Activer l'image Mender
INHERIT += "mender-full"
INHERIT:remove = "create-spdx"

# Nom de l'artefact Mender (version de votre image)
# Changez cette valeur à chaque nouvelle version pour le déploiement OTA
MENDER_ARTIFACT_NAME = "robot-image-1.0.0"

# Taille des partitions (en MB)
# Image compacte de 8 GB pour copie rapide (extensible sur carte 128 GB)
MENDER_STORAGE_TOTAL_SIZE_MB = "8192"
MENDER_BOOT_PART_SIZE_MB = "256"
MENDER_DATA_PART_SIZE_MB = "2048"

# Configuration du serveur Mender
# Pour un serveur local ou hébergé, décommentez et configurez:
# MENDER_SERVER_URL = "https://hosted.mender.io"
# MENDER_TENANT_TOKEN = "votre-token-ici"

# Pour un déploiement sans serveur (standalone), commentez les lignes ci-dessus

# Features supplémentaires de Mender
MENDER_FEATURES_ENABLE:append = " mender-uboot mender-image-sd"
MENDER_FEATURES_DISABLE:append = " mender-grub mender-image-uefi"

# Disable automatic patching for easier development
MENDER_UBOOT_AUTO_CONFIGURE = "0"

# Configuration spécifique RaspberryPi
RPI_USE_U_BOOT = "1"

# ==========================================
# Fin de la configuration Mender
# ==========================================

