# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

BBLAYERS ?= " \
  /workspace/yocto_robot/layers/poky/meta \
  /workspace/yocto_robot/layers/poky/meta-poky \
  /workspace/yocto_robot/layers/poky/meta-yocto-bsp \
  /workspace/yocto_robot/layers/meta-openembedded/meta-oe \
  /workspace/yocto_robot/layers/meta-openembedded/meta-python \
  /workspace/yocto_robot/layers/meta-openembedded/meta-networking \
  /workspace/yocto_robot/layers/meta-raspberrypi \
  /workspace/yocto_robot/layers/meta-lts-mixins \
  /workspace/yocto_robot/layers/meta-mender/meta-mender-core \
  /workspace/yocto_robot/layers/meta-mender-community/meta-mender-raspberrypi \
  /workspace/yocto_robot/layers/meta-robot \
  "
